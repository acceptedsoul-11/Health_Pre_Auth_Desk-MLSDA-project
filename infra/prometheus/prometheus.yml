global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: preauth-desk

rule_files: []

scrape_configs:
  - job_name: 'preauth-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'preauth-worker'
    static_configs:
      - targets: ['agent-worker:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
