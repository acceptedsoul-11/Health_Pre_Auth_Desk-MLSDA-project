# Health Insurance Pre-Authorization Desk - Docker Compose
# Start:         docker compose up -d
# Scale workers: docker compose --scale agent-worker=3 up -d
# Ingest corpus: docker compose run --rm corpus-ingest

services:

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preauth-backend
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=preauth-backend
      - PYTHONPATH=/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
    ports:
      - "8000:8000"
    volumes:
      - corpus_data:/app/corpus/processed
      - ./corpus:/app/corpus_src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"

  # Celery Agent Worker (scalable)
  agent-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preauth-agent-worker
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=preauth-worker
      - PYTHONPATH=/app
    command: >
      celery -A workers.tasks worker
      --loglevel=info
      --queues=preauth,eval
      --concurrency=2
      --max-tasks-per-child=100
      --hostname=worker@%h
    volumes:
      - corpus_data:/app/corpus/processed
      - ./corpus:/app/corpus_src:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.tasks", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Corpus Ingestion (one-shot init - run with: docker compose run --rm corpus-ingest)
  corpus-ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preauth-corpus-ingest
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
    command: python -m app.cli.ingest --embedding-model all-MiniLM-L6-v2 --embedding-device cpu
    volumes:
      - corpus_data:/app/corpus/processed
      - ./corpus:/app/corpus_src:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
    profiles:
      - ingest

  # Redis
  redis:
    image: redis:7.4-alpine
    container_name: preauth-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change-me-redis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: preauth-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-preauth_db}
      POSTGRES_USER: ${POSTGRES_USER:-preauth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preauth_user} -d ${POSTGRES_DB:-preauth_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Jaeger (OpenTelemetry Tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: preauth-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "memory"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: preauth-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:11.2.2
    container_name: preauth-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: preauth-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Flower (Celery monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: preauth-flower
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: >
      celery -A workers.tasks flower
      --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  corpus_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: preauth-network
    driver: bridge
